name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Core tests
        run: dotnet build tests/SideBar.Core.Tests -c Release

      - name: Build Nearby tests
        run: dotnet build tests/SideBar.Nearby.Tests -c Release

      - name: Run tests
        run: tests/SideBar.Core.Tests/bin/Release/net10.0-windows10.0.26100.0/SideBar.Core.Tests.exe

      - name: Run Nearby tests
        run: tests/SideBar.Nearby.Tests/bin/Release/net10.0-windows10.0.26100.0/SideBar.Nearby.Tests.exe

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/SideBar.App -c Release -p:Platform=x64 -o artifacts/app 2>&1 | tee publish.log

      - name: Check IL/AOT warnings
        shell: bash
        run: |
          if grep -E "warning (IL|AOT)" publish.log; then
            echo "::error::Publish produced IL/AOT warnings"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SideBar-win-x64
          path: artifacts/app

  installer:
    needs: build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          ver=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n1)
          if [ -z "$ver" ]; then echo "::error::Version not found"; exit 1; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: SideBar-win-x64
          path: artifacts/app

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\SideBar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: SideBar-setup
          path: artifacts/installer/SideBar-${{ steps.ver.outputs.version }}-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        env:
          VER: ${{ needs.installer.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version> $VER"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: SideBar-setup
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.installer.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/SideBar-$VER-setup.exe"             --title "SideBar $VER" --notes-file docs/release-notes.md
